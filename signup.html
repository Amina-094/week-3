<!DOCTYPE html>
<html>
<head>
<title>Sign Up Page</title>
</head>
<body bgcolor="#FFFFFF">
<header style="background-color:#AED6F1;">
<br>
<h1 align="center">Create Your Account</h1>
<br>
<hr>
</header>
<form action="thankyou.html" method="get">
<table align="center" cellpadding="10">
<tr>
<td colspan="2" align="center">
<h2>Sign Up</h2>
</td>
</tr>
<tr>
<td>Name:</td>
<td>
<input type="text" name="name" required>
</td>
</tr>
<tr>
<td>Email:</td>
<td>
<input type="email" name="email" required>
</td>
</tr>
<tr>
<td>Create Password:</td>
<td>
<input type="password" name="password" required>
</td>
</tr>
<tr>
<td>Confirm Password:</td>
<td>
<input type="password" name="confirm_password" required>
</td>
</tr>
<tr>
<td>Gender:</td>
<td>
<input type="radio" name="gender" value="Male" required>Male
<input type="radio" name="gender" value="Female">Female
</td>
</tr>
<tr>
<td>Country:</td>
<td>
<input list="countries" name="country" required>
<datalist id="countries">
<option value="Pakistan">
<option value="India">
<option value="China">
<option value="United Kingdom">
<option value="United States">
<option value="Canada">
<option value="Australia">
<option value="Germany">
<option value="France">
<option value="Japan">
</datalist>
</td>
</tr>

<tr>
<td colspan="2" align="center">
<h3 align="left">Terms and License</h3>
<textarea rows="8" cols="45" readonly>
1. You agree to provide accurate information when creating your account.
2. You are responsible for keeping your password confidential.
3. You agree to use this website responsibly and follow all applicable rules.
4. You must not misuse, damage, or interfere with the website or its content.
5. By creating an account, you confirm that you have read and understood these Terms and License.
6. These terms may be updated when necessary.
</textarea>
</td>
</tr>

<tr>
<td colspan="2">
<input type="checkbox" name="terms" required>
I agree to the Terms and License.
</td>
</tr>
<tr>
<td colspan="2" align="center">
<input type="submit" value="Sign Up" style="background-color: green; color: white;">
</td>
</tr>
<tr>
<td colspan="2" align="center">
Already have an account?
<a href=""index.html"">Login</a>
</td>
</tr>
</table>
</form>
<footer style="background-color:#AED6F1;">
<hr>
    <p align="center">© 2026 Our Website | All Rights Reserved</p>
</footer>
<br><br>

</body>
</html>
